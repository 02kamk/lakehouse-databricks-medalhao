site_name: Lakehouse da Academia - Azure SQL e Databricks
site_description: Trabalho 3 de Engenharia de Dados - Landing, Bronze, Silver e Gold com Databricks Free Edition
site_author: Kamily Hilário das Luzes, Kauã Lucas Alves Barbosa
site_url: https://02kamk.github.io/lakehouse-databricks-medalhao/
repo_url: https://github.com/02kamk/lakehouse-databricks-medalhao
repo_name: lakehouse-databricks-medalhao
edit_uri: edit/main/docs/

nav:
  - Visão geral: index.md
  - Cenário e dados: dados.md
  - Pipeline e orquestração: pipeline.md
  - Qualidade dos dados: qualidade.md
  - Modelo dimensional: modelagem.md
  - Validações e resultados: testes.md
  - Evidências: evidencias.md
  - Referências: referencias.md

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/02kamk/lakehouse-databricks-medalhao

